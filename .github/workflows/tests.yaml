name: "tests"
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: uv sync
        run: |
          uv sync
      - name: isort
        run: |
          uv run isort .
      - name: black
        run: |
          uv run black .
      - name: flake8
        run: |
          uv run flake8 .
      - name: Test with pytest
        run: |
          uv run pytest
